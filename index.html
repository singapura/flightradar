<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020a05;
    --phos: #39ff7a;
    --phos-dim: #1d8a43;
    --phos-faint: #0f3d20;
    --alert: #ff3b3b;
    --emg: #ff9628;
    --sel: #ffe066;
    --panel: rgba(4, 20, 10, 0.86);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--phos);
    font-family: "Share Tech Mono", ui-monospace, Consolas, monospace; }
  #scope { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .crt { pointer-events: none; position: fixed; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%); }
  .hud { position: fixed; padding: 14px 18px; font-size: 14px; line-height: 1.5; text-shadow: 0 0 6px rgba(57,255,122,0.6); }
  #hud-tl { top: 0; left: 0; }
  #hud-bl { bottom: 0; left: 0; color: var(--phos-dim); font-size: 12px; }
  .big { font-size: 26px; letter-spacing: 2px; }
  .dim { color: var(--phos-dim); }
  .alert { color: var(--alert); text-shadow: 0 0 6px rgba(255,69,69,0.7); }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; background: var(--panel);
    border-left: 1px solid var(--phos-faint); display: flex; flex-direction: column; transition: transform .25s; }
  #panel.hidden { transform: translateX(100%); }
  #panel h2 { margin: 0; padding: 12px 14px; font-size: 14px; font-weight: normal; letter-spacing: 2px;
    border-bottom: 1px solid var(--phos-faint); display: flex; justify-content: space-between; }
  #detail { padding: 12px 14px; border-bottom: 1px solid var(--phos-faint); font-size: 13px; display: none; }
  #detail.show { display: block; }
  #detail .cs { font-size: 22px; color: var(--sel); letter-spacing: 1px; }
  #detail .al { color: var(--phos); font-size: 14px; margin-top: -2px; }
  #detail table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  #detail td { padding: 2px 0; }
  #detail td:first-child { color: var(--phos-dim); width: 45%; }
  #list { flex: 1; overflow-y: auto; font-size: 13px; }
  #list::-webkit-scrollbar { width: 6px; } #list::-webkit-scrollbar-thumb { background: var(--phos-faint); }
  .row { display: grid; grid-template-columns: 1.3fr 0.8fr 0.8fr 0.7fr; gap: 4px; padding: 5px 14px; cursor: pointer;
    border-bottom: 1px solid rgba(15,61,32,0.5); }
  .row:hover { background: rgba(57,255,122,0.07); }
  .row.sel { background: rgba(255,224,102,0.12); color: var(--sel); }
  .row.c-cargo { color: rgb(77,201,255); }
  .row.c-military { color: rgb(197,140,255); }
  .row.c-unknown { color: rgb(168,181,173); }
  .row.emg { color: var(--emg); }
  .row.sel { color: var(--sel); }
  #legend { margin-top: 10px; font-size: 13px; }
  .lg { display: grid; grid-template-columns: 14px 90px 40px; align-items: center; cursor: pointer; text-shadow: none; }
  .lg i { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
  .lg span { text-align: right; }
  .lg.off { opacity: 0.35; text-decoration: line-through; }
  .lg:hover { filter: brightness(1.3); }
  .row.fol { color: var(--alert); background: rgba(255,59,59,0.1); }
  #toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column;
    gap: 8px; z-index: 5; width: min(420px, calc(100vw - 32px)); }
  body:not(.nopanel) #toasts { left: calc(50% - 160px); }
  .toast { --c: 197,140,255; background: rgba(3,14,8,0.94); border: 1px solid rgb(var(--c)); color: rgb(var(--c));
    padding: 8px 12px; font-size: 13px; cursor: pointer; box-shadow: 0 0 18px rgba(var(--c),0.35);
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; animation: tin .25s ease-out; transition: opacity .6s; }
  .toast b { font-weight: normal; letter-spacing: 2px; animation: tblink 0.5s steps(1) 6; }
  .toast div { grid-column: 1 / -1; color: #d8ffe6; }
  .toast.gone { opacity: 0; }
  @keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
  @keyframes tblink { 50% { opacity: 0.2; } }
  .tabs { display: flex; border-bottom: 1px solid var(--phos-faint); }
  .tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; background: none; padding: 11px 14px;
    font-size: 14px; letter-spacing: 2px; color: var(--phos-dim); display: flex; justify-content: space-between; }
  .tabs button.on { color: var(--phos); border-bottom-color: var(--phos); background: rgba(57,255,122,0.06); }
  .tab { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .tab.on { display: flex; }
  .logbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 12px;
    border-bottom: 1px solid var(--phos-faint); }
  .logbar button { font-size: 12px; padding: 4px 8px; }
  #log-list { flex: 1; overflow-y: auto; font-size: 12px; }
  #log-list::-webkit-scrollbar { width: 6px; } #log-list::-webkit-scrollbar-thumb { background: var(--phos-faint); }
  .le { padding: 6px 14px; border-bottom: 1px solid rgba(15,61,32,0.5); cursor: pointer; line-height: 1.45; }
  .le:hover { background: rgba(57,255,122,0.07); }
  .le .l1 { display: grid; grid-template-columns: auto 52px 1fr; gap: 8px; font-size: 13px; }
  .le .l1 b { font-weight: normal; text-align: right; }
  .le .l2 { color: #b9d6c3; opacity: 0.85; }
  .le.exit { opacity: 0.6; }
  .le.empty { cursor: default; color: var(--phos-dim); }
  #follow { cursor: pointer; display: none; }
  #follow.show { display: block; }
  #follow:hover { text-decoration: line-through; }
  #detail button { margin-top: 8px; width: 100%; }
  #detail button.fol { color: var(--alert); border-color: var(--alert); }
  .row.head { cursor: default; color: var(--phos-dim); font-size: 11px; position: sticky; top: 0; background: #031208; }
  .row span:not(:first-child) { text-align: right; }
  #controls { position: fixed; bottom: 14px; right: 334px; display: flex; gap: 6px; transition: right .25s; }
  body.nopanel #controls { right: 14px; }
  button, .btn { background: rgba(4,20,10,0.85); color: var(--phos); border: 1px solid var(--phos-dim); font: inherit;
    font-size: 13px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: rgba(57,255,122,0.12); }
  button.on { background: rgba(57,255,122,0.2); }
  dialog { background: #031208; color: var(--phos); border: 1px solid var(--phos-dim); padding: 18px 20px; min-width: 340px;
    font: inherit; }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog h3 { margin: 0 0 12px; font-weight: normal; letter-spacing: 2px; }
  dialog label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; font-size: 13px; }
  dialog input[type=number], dialog input[type=text] { background: #020a05; color: var(--phos); border: 1px solid var(--phos-faint);
    font: inherit; padding: 4px 6px; width: 150px; }
  dialog .actions { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .help { font-size: 12px; color: var(--phos-dim); margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="scope"></canvas>
<div class="crt"></div>

<div class="hud" id="hud-tl">
  <div class="big" id="clock">--:--:--</div>
  <div class="dim" id="utc">UTC --:--</div>
  <div id="loc">---</div>
  <div>RANGE <span id="range">--</span> NM</div>
  <div id="status" class="dim">CONNECTING…</div>
  <div id="follow" class="alert" title="Click to stop following"></div>
  <div id="legend" title="Click a type to show or hide it"></div>
</div>
<div class="hud" id="hud-bl">WHEEL / + − : RANGE &nbsp; CLICK : SELECT &nbsp; L : LABELS &nbsp; M : MAP &nbsp; P : PANEL &nbsp; F : FULLSCREEN</div>

<aside id="panel">
  <nav class="tabs">
    <button data-tab="traffic">TRAFFIC <span id="count">0</span></button>
    <button data-tab="log">LOG <span id="log-n">0</span></button>
  </nav>
  <section id="tab-traffic" class="tab">
    <div id="detail"></div>
    <div id="list"></div>
  </section>
  <section id="tab-log" class="tab">
    <div class="logbar">
      <span class="dim">MILITARY + UNKNOWN</span>
      <span><button id="log-save" title="Download the whole log as CSV">SAVE CSV</button> <button id="log-clear">CLEAR</button></span>
    </div>
    <div id="log-list"></div>
  </section>
</aside>

<div id="controls">
  <button id="btn-out" title="Zoom out">−</button>
  <button id="btn-in" title="Zoom in">+</button>
  <button id="btn-labels" class="on" title="Toggle labels (L)">LBL</button>
  <button id="btn-map" class="on" title="Toggle borders and cities (M)">MAP</button>
  <button id="btn-panel" title="Toggle panel (P)">LIST</button>
  <button id="btn-full" title="Fullscreen (F)">FULL</button>
  <button id="btn-log" title="Alert log">LOG</button>
  <button id="btn-set" title="Settings">SET</button>
</div>

<dialog id="settings">
  <form method="dialog">
    <h3>SETTINGS</h3>
    <label>Latitude <input type="number" step="0.0001" id="s-lat"></label>
    <label>Longitude <input type="number" step="0.0001" id="s-lon"></label>
    <label>Location name <input type="text" id="s-name" maxlength="24"></label>
    <label>Sweep period (s) <input type="number" min="2" max="20" step="1" id="s-sweep"></label>
    <label>Data refresh (s) <input type="number" min="3" max="60" step="1" id="s-refresh"></label>
    <label>Show aircraft on ground <input type="checkbox" id="s-ground"></label>
    <label>Follow flight <input type="text" id="s-follow" maxlength="10" placeholder="callsign, reg or hex"></label>
    <label>Hide above FL <input type="number" min="0" max="600" step="10" id="s-maxfl" placeholder="no limit"></label>
    <label>Alert on military flights <input type="checkbox" id="s-amil"></label>
    <label>Alert on unknown flights <input type="checkbox" id="s-aunk"></label>
    <label>Alert sound <input type="checkbox" id="s-asnd"></label>
    <div class="help">Data: community ADS-B feeds (adsb.lol, fallback adsb.fi). Range max 250 NM.</div>
    <div class="actions">
      <button type="button" id="s-geo">USE MY LOCATION</button>
      <span><button value="cancel">CANCEL</button> <button value="ok" id="s-ok">SAVE</button></span>
    </div>
  </form>
</dialog>

<div id="toasts"></div>

<script>
(() => {
  "use strict";

  // ---------- settings ----------
  const RANGES = [5, 10, 25, 50, 100, 150, 250];
  const DEFAULTS = { lat: 49.6233, lon: 6.2044, name: "ELLX", rangeIdx: 3, sweep: 6, refresh: 5,
                     ground: false, maxfl: null, labels: true, map: true, panel: true, follow: "", geoAsked: false,
                     alertMil: true, alertUnk: true, alertSound: true };
  let cfg = { ...DEFAULTS };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem("radar-cfg") || "{}")); } catch {}
  const save = () => { try { localStorage.setItem("radar-cfg", JSON.stringify(cfg)); } catch {} };

  // ---------- geo helpers ----------
  const R_NM = 3440.065, D2R = Math.PI / 180;
  function distBearing(lat1, lon1, lat2, lon2) {
    const p1 = lat1 * D2R, p2 = lat2 * D2R, dp = p2 - p1, dl = (lon2 - lon1) * D2R;
    const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
    const d = 2 * R_NM * Math.asin(Math.min(1, Math.sqrt(a)));
    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return { d, b: (Math.atan2(y, x) + 2 * Math.PI) % (2 * Math.PI) };
  }
  function project(lat, lon, trackDeg, nm) { // dead-reckon a short distance
    const t = trackDeg * D2R;
    return { lat: lat + (nm * Math.cos(t)) / 60, lon: lon + (nm * Math.sin(t)) / (60 * Math.cos(lat * D2R)) };
  }

  // ---------- state ----------
  const planes = new Map(); // hex -> plane
  let selected = null, lastOk = 0, lastErr = "", source = "";
  const $ = (id) => document.getElementById(id);
  const canvas = $("scope"), ctx = canvas.getContext("2d");
  const bg = document.createElement("canvas"), bgx = bg.getContext("2d");
  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;

  const range = () => RANGES[cfg.rangeIdx];
  const isEmergency = (p) => ["7500", "7600", "7700"].includes(p.squawk) || (p.emergency && p.emergency !== "none");

  // ---------- data ----------
  async function poll() {
    try {
      const res = await fetch(`/api/aircraft?lat=${cfg.lat}&lon=${cfg.lon}&dist=${Math.min(250, Math.ceil(range() * 1.15))}`);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || res.status);
      const recv = performance.now(), seen = new Set();
      for (const a of json.ac) upsert(a, recv, seen);
      // followed flight not in the local area: look it up worldwide
      // (throttled to every 15 s to stay within the feeds' rate limits)
      const followHere = [...seen].some((h) => isFollowed(planes.get(h)));
      if (cfg.follow && !followHere && Date.now() - lastFind < 15000) {
        planes.forEach((p, h) => { if (isFollowed(p)) seen.add(h); });
      } else if (cfg.follow && !followHere) {
        lastFind = Date.now();
        if (followStatus !== "found") followStatus = "searching";
        try {
          const f = await fetch(`/api/find?q=${encodeURIComponent(cfg.follow)}`).then((r) => r.json());
          const ac = (f.ac || []).filter((a) => a.lat != null);
          ac.forEach((a) => upsert(a, recv, seen));
          followStatus = ac.length ? "found" : "notfound";
        } catch { followStatus = "error"; }
      } else if (cfg.follow) followStatus = "found";
      for (const [hex, p] of planes) if (!seen.has(hex) && recv - p.fixTime > 60000) planes.delete(hex);
      checkAlerts();
      lastOk = Date.now(); lastErr = ""; source = json.source;
      renderList();
    } catch (e) {
      lastErr = String(e.message || e);
    }
  }
  function upsert(a, recv, seen) {
    if (a.lat == null || a.lon == null) return;
    const onGround = a.alt_baro === "ground";
    const p = planes.get(a.hex) || { hex: a.hex, trail: [], painted: null, paintedAt: -1e9 };
    Object.assign(p, {
      flight: (a.flight || "").trim(), reg: a.r || "", type: a.t || "", desc: a.desc || "",
      alt: onGround ? 0 : (a.alt_baro ?? a.alt_geom ?? null), ground: onGround,
      gs: a.gs ?? null, track: a.track ?? a.true_heading ?? null, vr: a.baro_rate ?? a.geom_rate ?? null,
      squawk: a.squawk || "", emergency: a.emergency, lat: a.lat, lon: a.lon,
      dbFlags: a.dbFlags || 0, category: a.category || "", fixTime: recv - (a.seen_pos || 0) * 1000,
    });
    p.cls = classify(p);
    planes.set(a.hex, p); seen.add(a.hex);
  }

  // ---------- flight type ----------
  // Military: the feed's database flag (dbFlags bit 1), plus well-known military callsigns and types.
  // Cargo: ICAO operator prefix of the callsign. Unknown: no callsign, registration or type at all.
  const CLASSES = {
    civilian: { label: "CIVILIAN", rgb: "57,255,122" },
    cargo:    { label: "CARGO",    rgb: "77,201,255" },
    military: { label: "MILITARY", rgb: "197,140,255" },
    unknown:  { label: "UNKNOWN",  rgb: "168,181,173" },
  };
  const CARGO_OPS = new Set(("CLX ICV FDX UPS GTI ABW CKS BOX GEC DHK BCS DHX DAE SWN NPT TAY CHG ICL MNB AZG VDA ADB " +
    "NCA PAC ATN AJT WGN KYE MPH AHK CAO CKK CSS SQC MSX LCO LTG TPA BBD SRR MTN GSS ABR").split(" "));
  const MIL_CALLSIGNS = /^(RCH|CNV|NATO|GAF|BAF|CTM|RRR|IAM|NAF|PLF|CFC|ASY|ASCOT|FORTE)/;
  const MIL_TYPES = new Set("K35R KC2 KC10 K46 C17 C5M C130 C30J A400 E3TF E3CF E6 P8 R135 EUFI F16 F15 F18 F35 F22 TOR RFAL M2KM H47 V22".split(" "));
  // airline from the ICAO prefix of the callsign (Virtual Radar Server standing data, CC0)
  let AIRLINES = {};
  fetch("/data/airlines.json").then((r) => r.json()).then((j) => { AIRLINES = j; renderList(); }).catch(() => {});
  function airlineOf(p) {
    const m = (p.flight || "").toUpperCase().match(/^([A-Z]{3})\d/);
    return (m && AIRLINES[m[1]]) || "";
  }
  function classify(p) {
    const cs = p.flight.toUpperCase();
    if (p.dbFlags & 1 || MIL_CALLSIGNS.test(cs) || MIL_TYPES.has(p.type)) return "military";
    const op = cs.match(/^([A-Z]{3})\d/);
    if (op && CARGO_OPS.has(op[1])) return "cargo";
    if (!cs && !p.reg && !p.type) return "unknown";
    return "civilian";
  }

  // ---------- follow ----------
  let followStatus = "", lastFind = 0;
  function isFollowed(p) {
    if (!p || !cfg.follow) return false;
    const q = cfg.follow;
    return p.flight.toUpperCase() === q || p.reg.toUpperCase() === q || p.hex.toUpperCase() === q;
  }
  function setFollow(q) {
    cfg.follow = (q || "").trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
    followStatus = cfg.follow ? "searching" : ""; lastFind = 0;
    save(); schedulePoll(); renderList();
  }
  const followKey = (p) => (p.flight || p.reg || p.hex).toUpperCase();
  let pollTimer;
  function schedulePoll() { clearInterval(pollTimer); poll(); pollTimer = setInterval(poll, cfg.refresh * 1000); }

  function currentPos(p, now) {
    if (p.gs == null || p.track == null || p.ground) return { lat: p.lat, lon: p.lon };
    const dtH = Math.min(30, (now - p.fixTime) / 1000) / 3600;
    return project(p.lat, p.lon, p.track, p.gs * dtH);
  }
  function visible(p) {
    if (isFollowed(p)) return true;
    if (cfg.hidden?.[p.cls]) return false;
    if (p.ground && !cfg.ground) return false;
    if (cfg.maxfl && p.alt != null && p.alt / 100 > cfg.maxfl) return false;
    return true;
  }

  // ---------- drawing ----------
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [canvas, bg]) { c.width = W * DPR; c.height = H * DPR; }
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    const panelW = cfg.panel ? 320 : 0;
    cx = (W - panelW) / 2; cy = H / 2;
    R = Math.max(80, Math.min((W - panelW) / 2, H / 2) - 40);
    drawBackground();
  }

  function drawBackground() {
    const g = bgx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    const rad = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    rad.addColorStop(0, "#06210f"); rad.addColorStop(1, "#020c06");
    g.fillStyle = rad; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();

    drawMap(g);

    g.strokeStyle = "rgba(57,255,122,0.22)"; g.lineWidth = 1;
    g.font = "12px 'Share Tech Mono', monospace"; g.fillStyle = "rgba(57,255,122,0.5)";
    const rings = 4;
    for (let i = 1; i <= rings; i++) {
      const r = (R * i) / rings;
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
      const label = +(range() * i / rings).toFixed(1);
      g.fillText(label + "", cx + 4, cy - r + 13);
    }
    // cross hairs + 30° spokes
    g.strokeStyle = "rgba(57,255,122,0.12)";
    for (let a = 0; a < 360; a += 30) {
      const t = a * D2R;
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(t) * R, cy - Math.cos(t) * R); g.stroke();
    }
    // bezel ticks
    g.strokeStyle = "rgba(57,255,122,0.55)";
    for (let a = 0; a < 360; a += 5) {
      const t = a * D2R, len = a % 30 === 0 ? 12 : a % 10 === 0 ? 7 : 4;
      g.beginPath();
      g.moveTo(cx + Math.sin(t) * R, cy - Math.cos(t) * R);
      g.lineTo(cx + Math.sin(t) * (R + len), cy - Math.cos(t) * (R + len));
      g.stroke();
    }
    g.fillStyle = "rgba(57,255,122,0.75)"; g.textAlign = "center"; g.textBaseline = "middle";
    for (let a = 0; a < 360; a += 30) {
      const t = a * D2R, lbl = { 0: "N", 90: "E", 180: "S", 270: "W" }[a] || String(a).padStart(3, "0");
      g.fillText(lbl, cx + Math.sin(t) * (R + 24), cy - Math.cos(t) * (R + 24));
    }
    g.textAlign = "left"; g.textBaseline = "alphabetic";
    g.strokeStyle = "rgba(57,255,122,0.7)"; g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
    // own position
    g.strokeStyle = "rgba(57,255,122,0.8)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx - 6, cy); g.lineTo(cx + 6, cy); g.moveTo(cx, cy - 6); g.lineTo(cx, cy + 6); g.stroke();
  }

  // ---------- map: country borders, coastlines, cities ----------
  let geo = null, hoverCity = null;
  const HOVER_NAMES_FROM = 100; // NM: from this range up, city names only show on hover
  async function loadMap() {
    try {
      const [topo, cities] = await Promise.all([
        fetch("/data/countries-10m.json").then((r) => r.json()),
        fetch("/data/cities.json").then((r) => r.json()),
      ]);
      const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
      // arcs used by two countries are land borders, arcs used once are coastlines
      const use = new Uint8Array(topo.arcs.length);
      const walk = (a) => Array.isArray(a) ? a.forEach(walk) : typeof a === "number" && use[a < 0 ? ~a : a]++;
      topo.objects.countries.geometries.forEach((g) => walk(g.arcs));
      const arcs = topo.arcs.map((arc, i) => {
        const pts = new Float64Array(arc.length * 2);
        let x = 0, y = 0, x0 = 180, y0 = 90, x1 = -180, y1 = -90;
        arc.forEach(([dx, dy], k) => {
          x += dx; y += dy;
          const lon = x * sx + tx, lat = y * sy + ty;
          pts[k * 2] = lon; pts[k * 2 + 1] = lat;
          if (lon < x0) x0 = lon; if (lon > x1) x1 = lon; if (lat < y0) y0 = lat; if (lat > y1) y1 = lat;
        });
        return { pts, bbox: [x0, y0, x1, y1], border: use[i] > 1 };
      });
      geo = { arcs, cities };
      drawBackground();
    } catch (e) { console.warn("map data not loaded", e); }
  }

  function drawMap(g) {
    if (!geo || !cfg.map) return;
    g.save();
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
    const latSpan = (range() * 1.5) / 60, lonSpan = latSpan / Math.max(0.05, Math.cos(cfg.lat * D2R));
    const box = [cfg.lon - lonSpan, cfg.lat - latSpan, cfg.lon + lonSpan, cfg.lat + latSpan];
    const hit = (b) => b[0] <= box[2] && b[2] >= box[0] && b[1] <= box[3] && b[3] >= box[1];
    g.lineWidth = 1;
    for (const border of [false, true]) {
      g.beginPath();
      for (const a of geo.arcs) {
        if (a.border !== border || !hit(a.bbox)) continue;
        for (let k = 0; k < a.pts.length; k += 2) {
          const p = toXY(a.pts[k + 1], a.pts[k]);
          k ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
        }
      }
      g.strokeStyle = border ? "rgba(57,255,122,0.38)" : "rgba(57,255,122,0.28)";
      g.setLineDash(border ? [5, 4] : []);
      g.stroke();
    }
    g.setLineDash([]);

    // cities: biggest first, skip any whose label would overlap one already drawn
    // at large ranges only dots are drawn; names appear on hover (see frame())
    const placed = [], maxLabels = 40, showNames = range() < HOVER_NAMES_FROM;
    geo.screen = []; hoverCity = null;
    g.font = "11px 'Share Tech Mono', monospace";
    for (const [name, lat, lon, , cap] of geo.cities) {
      if (placed.length >= maxLabels) break;
      if (Math.abs(lat - cfg.lat) > latSpan || Math.abs(lon - cfg.lon) > lonSpan) continue;
      const p = toXY(lat, lon);
      if (p.d > range() * 0.97) continue;
      const w = g.measureText(name).width;
      const rect = [p.x - 4, p.y - 12, p.x + 7 + w, p.y + 4];
      if (placed.some((q) => rect[0] < q[2] && rect[2] > q[0] && rect[1] < q[3] && rect[3] > q[1])) continue;
      placed.push(rect);
      geo.screen.push({ name: name.toUpperCase(), x: p.x, y: p.y, cap });
      g.fillStyle = cap === 2 ? "rgba(57,255,122,0.72)" : "rgba(57,255,122,0.55)";
      if (cap === 2) { g.strokeStyle = g.fillStyle; g.beginPath(); g.arc(p.x, p.y, 3, 0, Math.PI * 2); g.stroke(); }
      g.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      if (showNames) g.fillText(name.toUpperCase(), p.x + 6, p.y - 3);
    }
    g.restore();
  }

  function toXY(lat, lon) {
    const { d, b } = distBearing(cfg.lat, cfg.lon, lat, lon);
    const r = (d / range()) * R;
    return { x: cx + Math.sin(b) * r, y: cy - Math.cos(b) * r, d, b };
  }

  let prevSweep = 0;
  const TRAIL_ANGLE = 1.4; // radians of afterglow

  function frame(nowMs) {
    const period = cfg.sweep * 1000;
    const sweep = ((nowMs % period) / period) * 2 * Math.PI; // clockwise from north

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0, W, H);

    // sweep afterglow
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    const cAng = sweep - Math.PI / 2;
    const grad = ctx.createConicGradient(cAng - TRAIL_ANGLE, cx, cy);
    grad.addColorStop(0, "rgba(57,255,122,0)");
    grad.addColorStop(TRAIL_ANGLE / (2 * Math.PI), "rgba(57,255,122,0.28)");
    grad.addColorStop(TRAIL_ANGLE / (2 * Math.PI) + 0.0001, "rgba(57,255,122,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, cAng - TRAIL_ANGLE, cAng); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(140,255,180,0.9)"; ctx.lineWidth = 2;
    ctx.shadowColor = "#39ff7a"; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(cAng) * R, cy + Math.sin(cAng) * R); ctx.stroke();
    ctx.restore();

    // paint targets the sweep just crossed
    const crossed = (b) => prevSweep <= sweep ? (b > prevSweep && b <= sweep) : (b > prevSweep || b <= sweep);
    for (const p of planes.values()) {
      if (!visible(p)) continue;
      const pos = currentPos(p, nowMs);
      const xy = toXY(pos.lat, pos.lon);
      if (crossed(xy.b) || p.painted == null) {
        if (p.painted) { p.trail.push(p.painted); if (p.trail.length > 8) p.trail.shift(); }
        p.painted = pos; p.paintedAt = nowMs;
      }
    }
    prevSweep = sweep;

    // draw targets
    let edgeMarker = null;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R + 1, 0, Math.PI * 2); ctx.clip();
    ctx.font = "12px 'Share Tech Mono', monospace";
    for (const p of planes.values()) {
      if (!visible(p) || !p.painted) continue;
      const xy = toXY(p.painted.lat, p.painted.lon);
      const fol = isFollowed(p);
      p._xy = null;
      if (xy.d > range() * 1.02) { if (fol) edgeMarker = { p, xy }; continue; }
      const age = (nowMs - p.paintedAt) / period;
      const isSel = selected === p.hex, emg = isEmergency(p);
      const blink = emg && Math.floor(nowMs / 400) % 2 === 0;
      const glow = fol ? Math.max(0.6, 1 - age * 0.4) : Math.max(0.25, 1 - age * 0.75) * (blink ? 0.35 : 1);
      const rgb = fol ? "255,59,59" : emg ? "255,150,40" : isSel ? "255,224,102" : CLASSES[p.cls || "civilian"].rgb;
      if (fol) {
        ctx.strokeStyle = `rgba(${rgb},0.85)`; ctx.lineWidth = 1.5;
        const s = 11 + Math.sin(nowMs / 250) * 1.5;
        ctx.beginPath(); ctx.moveTo(xy.x, xy.y - s); ctx.lineTo(xy.x + s, xy.y); ctx.lineTo(xy.x, xy.y + s); ctx.lineTo(xy.x - s, xy.y); ctx.closePath(); ctx.stroke();
        ctx.lineWidth = 1;
      }

      // trail
      p.trail.forEach((t, i) => {
        const q = toXY(t.lat, t.lon);
        ctx.fillStyle = `rgba(${rgb},${0.08 + (i / p.trail.length) * 0.25})`;
        ctx.beginPath(); ctx.arc(q.x, q.y, 1.6, 0, Math.PI * 2); ctx.fill();
      });

      // velocity vector (1 minute ahead)
      if (p.track != null && p.gs) {
        const ahead = project(p.painted.lat, p.painted.lon, p.track, p.gs / 60);
        const v = toXY(ahead.lat, ahead.lon);
        ctx.strokeStyle = `rgba(${rgb},${glow * 0.7})`; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(xy.x, xy.y); ctx.lineTo(v.x, v.y); ctx.stroke();
      }

      // blip
      ctx.shadowColor = `rgb(${rgb})`; ctx.shadowBlur = 10 * glow;
      ctx.fillStyle = `rgba(${rgb},${glow})`;
      ctx.beginPath(); ctx.arc(xy.x, xy.y, isSel ? 4.5 : 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      if (isSel) {
        ctx.strokeStyle = `rgba(${rgb},0.9)`;
        ctx.strokeRect(xy.x - 9, xy.y - 9, 18, 18);
      }

      // data block
      if (cfg.labels || isSel || emg || fol) {
        const la = Math.max(0.45, glow);
        ctx.fillStyle = `rgba(${rgb},${la})`;
        const fl = p.ground ? "GND" : p.alt != null ? String(Math.round(p.alt / 100)).padStart(3, "0") : "---";
        const trend = p.vr > 300 ? "↑" : p.vr < -300 ? "↓" : " ";
        ctx.fillText(p.flight || p.reg || p.hex.toUpperCase(), xy.x + (fol ? 16 : 9), xy.y - 4);
        ctx.fillText(`${fl}${trend} ${p.gs != null ? Math.round(p.gs) : "---"}`, xy.x + (fol ? 16 : 9), xy.y + 9);
      }
      p._xy = xy;
    }
    ctx.restore();

    // followed flight outside the range: red arrow on the rim pointing at it
    if (edgeMarker) {
      const { p, xy } = edgeMarker, t = xy.b;
      const ux = Math.sin(t), uy = -Math.cos(t);
      const tipX = cx + ux * (R - 4), tipY = cy + uy * (R - 4);
      const baseX = cx + ux * (R - 20), baseY = cy + uy * (R - 20);
      const nx = -uy * 7, ny = ux * 7;
      const a = 0.65 + 0.35 * Math.sin(nowMs / 250);
      ctx.fillStyle = `rgba(255,59,59,${a})`;
      ctx.shadowColor = "#ff3b3b"; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(baseX + nx, baseY + ny); ctx.lineTo(baseX - nx, baseY - ny); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = "12px 'Share Tech Mono', monospace";
      const txt = `${followKey(p)} ${fmt(xy.d, 0)} NM`;
      const w = ctx.measureText(txt).width;
      ctx.fillStyle = "rgba(255,59,59,0.95)";
      ctx.fillText(txt, cx + ux * (R - 34 - w / 2 * Math.abs(ux)) - w / 2, cy + uy * (R - 34) + 4);
      p._xy = { x: baseX, y: baseY };
    }

    // hovered city name (large ranges only)
    if (hoverCity && cfg.map && range() >= HOVER_NAMES_FROM) {
      const c = hoverCity;
      ctx.font = "12px 'Share Tech Mono', monospace";
      const w = ctx.measureText(c.name).width;
      ctx.fillStyle = "rgba(2,12,6,0.85)";
      ctx.fillRect(c.x + 5, c.y - 17, w + 8, 17);
      ctx.strokeStyle = "rgba(57,255,122,0.5)"; ctx.lineWidth = 1;
      ctx.strokeRect(c.x + 5.5, c.y - 16.5, w + 7, 16);
      ctx.beginPath(); ctx.arc(c.x, c.y, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(140,255,180,0.95)";
      ctx.fillText(c.name, c.x + 9, c.y - 4);
    }

    updateHud();
    if (selected && nowMs - lastDetail > 1000) { renderDetail(); lastDetail = nowMs; }
    requestAnimationFrame(frame);
  }
  let lastDetail = 0;

  // ---------- HUD / panel ----------
  function updateHud() {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString("de-DE", { hour12: false });
    $("utc").textContent = "UTC " + d.toISOString().slice(11, 19);
    const st = $("status");
    const ago = Math.round((Date.now() - lastOk) / 1000);
    if (lastErr && (!lastOk || ago > cfg.refresh * 3)) { st.textContent = "NO DATA · " + lastErr; st.className = "alert"; }
    else if (lastOk) { st.textContent = `LIVE · ${source} · ${ago}s`; st.className = "dim"; }
    const fe = $("follow");
    fe.classList.toggle("show", !!cfg.follow);
    if (cfg.follow) {
      const fp = [...planes.values()].find(isFollowed);
      let txt = `FOLLOW ${cfg.follow} · `;
      if (fp) {
        const pos = currentPos(fp, performance.now());
        const { d } = distBearing(cfg.lat, cfg.lon, pos.lat, pos.lon);
        txt += `${fmt(d, 1)} NM` + (d > range() ? " (OUT OF RANGE)" : "");
      } else txt += { searching: "SEARCHING…", notfound: "NOT AIRBORNE / NOT FOUND", error: "LOOKUP FAILED" }[followStatus] || "SEARCHING…";
      fe.textContent = txt + "  ✕";
    }
  }
  const fmt = (v, dec = 0) => v == null ? "—" : Number(v).toLocaleString("de-DE", { maximumFractionDigits: dec, minimumFractionDigits: dec });

  function sortedVisible() {
    const now = performance.now();
    return [...planes.values()].filter(visible).map((p) => {
      const pos = currentPos(p, now);
      return { p, ...distBearing(cfg.lat, cfg.lon, pos.lat, pos.lon) };
    }).filter((o) => o.d <= range() || isFollowed(o.p))
      .sort((a, b) => (isFollowed(b.p) - isFollowed(a.p)) || a.d - b.d);
  }

  function renderList() {
    const items = sortedVisible();
    $("count").textContent = items.length;
    const html = ['<div class="row head"><span>CALLSIGN</span><span>TYPE</span><span>FL</span><span>NM</span></div>'];
    for (const { p, d } of items) {
      const cls = ["row", "c-" + p.cls, selected === p.hex ? "sel" : "", isEmergency(p) ? "emg" : "", isFollowed(p) ? "fol" : ""].join(" ");
      const fl = p.ground ? "GND" : p.alt != null ? Math.round(p.alt / 100) : "—";
      html.push(`<div class="${cls}" data-hex="${p.hex}" title="${esc(airlineOf(p))}"><span>${esc(p.flight || p.reg || p.hex.toUpperCase())}</span>` +
        `<span>${esc(p.type || "—")}</span><span>${fl}</span><span>${fmt(d, 1)}</span></div>`);
    }
    $("list").innerHTML = html.join("");
    renderLegend();
    renderDetail();
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // legend: counts per type within range (hidden types included), click to show/hide a type
  function renderLegend() {
    const now = performance.now(), counts = { civilian: 0, cargo: 0, military: 0, unknown: 0 };
    for (const p of planes.values()) {
      const pos = currentPos(p, now);
      if (distBearing(cfg.lat, cfg.lon, pos.lat, pos.lon).d <= range() && (!p.ground || cfg.ground)) counts[p.cls]++;
    }
    $("legend").innerHTML = Object.entries(CLASSES).map(([k, c]) =>
      `<div class="lg ${cfg.hidden?.[k] ? "off" : ""}" data-cls="${k}" style="color:rgb(${c.rgb})">` +
      `<i style="background:rgb(${c.rgb})"></i>${c.label}<span>${counts[k]}</span></div>`).join("");
  }

  function renderDetail() {
    const el = $("detail"), p = selected && planes.get(selected);
    if (!p) { el.className = ""; el.innerHTML = ""; return; }
    const pos = currentPos(p, performance.now());
    const { d, b } = distBearing(cfg.lat, cfg.lon, pos.lat, pos.lon);
    const rows = [
      ["Category", CLASSES[p.cls].label], ["Registration", p.reg || "—"], ["Type", (p.type || "—") + (p.desc ? " · " + p.desc : "")],
      ["Altitude", p.ground ? "On ground" : p.alt != null ? fmt(p.alt) + " ft" : "—"],
      ["Vertical rate", p.vr != null ? fmt(p.vr) + " ft/min" : "—"],
      ["Ground speed", p.gs != null ? fmt(p.gs) + " kt" : "—"],
      ["Track", p.track != null ? fmt(p.track) + "°" : "—"],
      ["Squawk", p.squawk || "—"],
      ["Distance", fmt(d, 1) + " NM"], ["Bearing", fmt(b / D2R) + "°"],
      ["ICAO hex", p.hex.toUpperCase()],
    ];
    el.className = "show";
    const html = `<div class="cs" style="${isFollowed(p) ? "color:var(--alert)" : isEmergency(p) ? "color:var(--emg)" : ""}">${esc(p.flight || p.reg || p.hex.toUpperCase())}</div>` +
      (airlineOf(p) ? `<div class="al">${esc(airlineOf(p))}</div>` : "") +
      `<table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>` +
      `<div class="help"><a class="dim" target="_blank" rel="noopener" href="https://globe.adsb.lol/?icao=${p.hex}">Open on map ↗</a></div>`;
    const btn = isFollowed(p) ? `<button class="fol" data-follow="">UNFOLLOW</button>`
                              : `<button data-follow="${esc(followKey(p))}">FOLLOW ${esc(followKey(p))}</button>`;
    if (!el.firstElementChild) el.innerHTML = '<div class="dinfo"></div><div class="dbtn"></div>';
    // only touch the button when it changes, so it survives a click during the 1 s refresh
    const [info, bt] = el.children;
    info.innerHTML = html;
    if (bt.innerHTML !== btn) bt.innerHTML = btn;
  }

  function select(hex) { selected = hex === selected ? null : hex; renderList(); }

  // ---------- input ----------
  canvas.addEventListener("click", (e) => {
    let best = null, bestD = 14;
    for (const p of planes.values()) {
      if (!p._xy || !visible(p)) continue;
      const dd = Math.hypot(p._xy.x - e.clientX, p._xy.y - e.clientY);
      if (dd < bestD) { bestD = dd; best = p.hex; }
    }
    if (best) { if (selected !== best) showTab("traffic"); select(best); }
    else if (selected) select(selected);
  });
  $("detail").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-follow]");
    if (b) setFollow(b.dataset.follow);
  });
  $("follow").addEventListener("click", () => setFollow(""));
  $("legend").addEventListener("click", (e) => {
    const el = e.target.closest(".lg[data-cls]");
    if (!el) return;
    cfg.hidden = { ...(cfg.hidden || {}), [el.dataset.cls]: !cfg.hidden?.[el.dataset.cls] };
    save(); renderList();
  });
  canvas.addEventListener("mousemove", (e) => {
    hoverCity = null;
    if (!geo?.screen || range() < HOVER_NAMES_FROM) return;
    let bestD = 10;
    for (const c of geo.screen) {
      const dd = Math.hypot(c.x - e.clientX, c.y - e.clientY);
      if (dd < bestD) { bestD = dd; hoverCity = c; }
    }
  });
  canvas.addEventListener("mouseleave", () => { hoverCity = null; });
  $("list").addEventListener("click", (e) => { const r = e.target.closest(".row[data-hex]"); if (r) select(r.dataset.hex); });

  function setRange(delta) {
    const i = Math.max(0, Math.min(RANGES.length - 1, cfg.rangeIdx + delta));
    if (i === cfg.rangeIdx) return;
    cfg.rangeIdx = i; save();
    $("range").textContent = range();
    for (const p of planes.values()) { p.trail = []; p.painted = null; }
    drawBackground(); schedulePoll();
  }
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); setRange(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  function togglePanel() {
    cfg.panel = !cfg.panel; save();
    $("panel").classList.toggle("hidden", !cfg.panel);
    document.body.classList.toggle("nopanel", !cfg.panel);
    $("btn-panel").classList.toggle("on", cfg.panel);
    resize();
  }
  function toggleLabels() { cfg.labels = !cfg.labels; save(); $("btn-labels").classList.toggle("on", cfg.labels); }
  function toggleMap() { cfg.map = !cfg.map; save(); $("btn-map").classList.toggle("on", cfg.map); drawBackground(); }
  function toggleFull() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

  $("btn-in").onclick = () => setRange(-1);
  $("btn-out").onclick = () => setRange(1);
  $("btn-labels").onclick = toggleLabels;
  $("btn-map").onclick = toggleMap;
  $("btn-panel").onclick = togglePanel;
  $("btn-full").onclick = toggleFull;
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("dialog")) return;
    const k = e.key.toLowerCase();
    if (k === "+" || k === "=") setRange(-1);
    else if (k === "-") setRange(1);
    else if (k === "l") toggleLabels();
    else if (k === "m") toggleMap();
    else if (k === "p") togglePanel();
    else if (k === "f") toggleFull();
    else if (k === "escape" && selected) select(selected);
  });

  // settings dialog
  const dlg = $("settings");
  $("btn-set").onclick = () => {
    $("s-lat").value = cfg.lat; $("s-lon").value = cfg.lon; $("s-name").value = cfg.name;
    $("s-sweep").value = cfg.sweep; $("s-refresh").value = cfg.refresh;
    $("s-ground").checked = cfg.ground; $("s-maxfl").value = cfg.maxfl ?? "";
    $("s-follow").value = cfg.follow || "";
    $("s-amil").checked = cfg.alertMil; $("s-aunk").checked = cfg.alertUnk; $("s-asnd").checked = cfg.alertSound;
    dlg.showModal();
  };
  $("s-geo").onclick = () => locate((lat, lon) => { $("s-lat").value = lat.toFixed(4); $("s-lon").value = lon.toFixed(4); $("s-name").value = "MY POSITION"; });
  dlg.addEventListener("close", () => {
    if (dlg.returnValue !== "ok") return;
    const lat = parseFloat($("s-lat").value), lon = parseFloat($("s-lon").value);
    if (Number.isFinite(lat) && Number.isFinite(lon)) { cfg.lat = lat; cfg.lon = lon; }
    cfg.name = $("s-name").value.trim() || "---";
    cfg.sweep = Math.max(2, Math.min(20, +$("s-sweep").value || 6));
    cfg.refresh = Math.max(3, Math.min(60, +$("s-refresh").value || 5));
    cfg.ground = $("s-ground").checked;
    cfg.maxfl = +$("s-maxfl").value || null;
    cfg.alertMil = $("s-amil").checked; cfg.alertUnk = $("s-aunk").checked; cfg.alertSound = $("s-asnd").checked;
    cfg.follow = $("s-follow").value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
    followStatus = cfg.follow ? "searching" : ""; lastFind = 0;
    save(); applyLocation();
  });

  function locate(cb) {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => cb(pos.coords.latitude, pos.coords.longitude), () => {}, { timeout: 10000 });
  }
  function applyLocation() {
    planes.clear(); selected = null;
    watch.clear();
    $("loc").textContent = `${cfg.name} · ${fmt(cfg.lat, 4)}, ${fmt(cfg.lon, 4)}`;
    schedulePoll();
  }

  // ---------- alerts + log ----------
  // An ENTER event fires when a military/unknown aircraft first shows up inside the range,
  // an EXIT event when it leaves the range or drops out of the data.
  const watch = new Map(); // hex -> { enteredAt, snap }
  const lastToast = new Map(); // hex -> time of last toast (same aircraft toasts at most every 10 min)
  let log = [];
  try { log = JSON.parse(localStorage.getItem("radar-log") || "[]"); } catch {}
  const saveLog = () => { try { localStorage.setItem("radar-log", JSON.stringify(log.slice(-3000))); } catch {} };
  const alertOn = (cls) => (cls === "military" && cfg.alertMil) || (cls === "unknown" && cfg.alertUnk);

  function snapshot(p) {
    const pos = currentPos(p, performance.now());
    const { d, b } = distBearing(cfg.lat, cfg.lon, pos.lat, pos.lon);
    return { cls: p.cls, hex: p.hex, flight: p.flight, airline: airlineOf(p), reg: p.reg, type: p.type, alt: p.ground ? 0 : p.alt,
             gs: p.gs, track: p.track, d, b: b / D2R, lat: pos.lat, lon: pos.lon, squawk: p.squawk };
  }
  function checkAlerts() {
    const now = Date.now(), inRange = new Set();
    for (const p of planes.values()) {
      if (!alertOn(p.cls) || (p.ground && !cfg.ground)) continue;
      if (p.cls === "unknown" && /^C/.test(p.category || "")) continue; // ground vehicles, obstacles
      const s = snapshot(p);
      if (s.d > range()) continue;
      inRange.add(p.hex);
      if (!watch.has(p.hex)) {
        watch.set(p.hex, { enteredAt: now, snap: s });
        addLog({ t: new Date(now).toISOString(), ev: "ENTER", ...s });
        if (now - (lastToast.get(p.hex) || 0) > 600000) { lastToast.set(p.hex, now); toast(p, s); }
      } else watch.get(p.hex).snap = s;
    }
    for (const [hex, w] of watch) {
      if (inRange.has(hex)) continue;
      watch.delete(hex);
      addLog({ t: new Date(now).toISOString(), ev: "EXIT", ...w.snap, dur: (now - w.enteredAt) / 60000 });
    }
  }
  function addLog(e) {
    log.push(e); saveLog(); updateLogBadge();
    if (cfg.tab === "log") renderLog();
  }
  function updateLogBadge() { $("btn-log").textContent = `LOG ${log.length}`; $("log-n").textContent = log.length; }

  // toast + beep
  let audio;
  function beep(cls) {
    if (!cfg.alertSound) return;
    try {
      audio = audio || new AudioContext();
      const tones = cls === "military" ? [880, 660, 880] : [520, 520];
      tones.forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.18;
        o.frequency.value = f; o.type = "square";
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.08, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
        o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.16);
      });
    } catch {}
  }
  function toast(p, s) {
    const c = CLASSES[s.cls], box = $("toasts");
    const el = document.createElement("div");
    el.className = "toast"; el.style.setProperty("--c", c.rgb);
    el.innerHTML = `<b>${c.label} ENTERED RANGE</b><span>${new Date().toLocaleTimeString("de-DE", { hour12: false })}</span>` +
      `<div>${esc(s.flight || s.reg || s.hex.toUpperCase())}${s.airline ? " (" + esc(s.airline) + ")" : ""} · ${esc(s.type || "type ?")} · ` +
      `${s.alt != null ? "FL" + String(Math.round(s.alt / 100)).padStart(3, "0") : "alt ?"} · ` +
      `${fmt(s.d, 1)} NM / ${fmt(s.b)}°</div>`;
    el.onclick = () => { if (planes.has(s.hex)) { selected = null; showTab("traffic"); select(s.hex); } el.remove(); };
    box.prepend(el);
    while (box.children.length > 4) box.lastChild.remove();
    setTimeout(() => el.classList.add("gone"), 12000);
    setTimeout(() => el.remove(), 12600);
    beep(s.cls);
  }

  // log tab in the side panel (newest first; the newest 500 are shown, the CSV has everything)
  const dt = (iso) => {
    const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
    return (today ? "" : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + " ") + d.toLocaleTimeString("de-DE", { hour12: false });
  };
  function renderLog() {
    $("log-list").innerHTML = log.length ? log.slice(-500).reverse().map((e) => {
      const c = CLASSES[e.cls] || CLASSES.civilian;
      const alt = e.alt == null ? "alt ?" : e.alt === 0 ? "GND" : "FL" + String(Math.round(e.alt / 100)).padStart(3, "0");
      return `<div class="le ${e.ev === "EXIT" ? "exit" : ""}" data-hex="${e.hex}" style="color:rgb(${c.rgb})">` +
        `<div class="l1"><span>${dt(e.t)}</span><span>${e.ev}</span><b>${esc(e.flight || e.reg || e.hex.toUpperCase())}</b></div>` +
        `<div class="l2">${c.label}${e.airline ? " · " + esc(e.airline) : ""} · ${esc(e.type || "type ?")} · ${alt} · ${fmt(e.d, 1)} NM / ${fmt(e.b)}°` +
        `${e.dur != null ? " · " + fmt(e.dur, 1) + " min in range" : ""}</div></div>`;
    }).join("") : `<div class="le empty">No military or unknown aircraft logged yet.</div>`;
  }
  function showTab(t) {
    cfg.tab = t; save();
    if (!cfg.panel) togglePanel();
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
    $("tab-traffic").classList.toggle("on", t === "traffic");
    $("tab-log").classList.toggle("on", t === "log");
    if (t === "log") renderLog();
  }
  document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
  $("log-list").addEventListener("click", (e) => {
    const r = e.target.closest(".le[data-hex]");
    if (r && planes.has(r.dataset.hex)) { selected = null; showTab("traffic"); select(r.dataset.hex); }
  });
  function saveCsv() {
    // semicolon + decimal comma so it opens directly in European Excel; timestamps stay ISO 8601 (UTC)
    const num = (v, d = 0) => v == null ? "" : Number(v).toFixed(d).replace(".", ",");
    const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const head = "time_utc;event;category;callsign;airline;registration;aircraft_type;icao_hex;altitude_ft;speed_kt;track_deg;distance_nm;bearing_deg;lat;lon;squawk;duration_min";
    const rows = log.map((e) => [e.t, e.ev, e.cls, q(e.flight), q(e.airline), q(e.reg), q(e.type), e.hex.toUpperCase(), num(e.alt), num(e.gs),
      num(e.track), num(e.d, 1), num(e.b), num(e.lat, 5), num(e.lon, 5), q(e.squawk), num(e.dur, 1)].join(";"));
    const blob = new Blob(["﻿" + [head, ...rows].join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `radar-log-${new Date().toISOString().slice(0, 19).replace(/:/g, "-")}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("btn-log").onclick = () => showTab(cfg.panel && cfg.tab === "log" ? "traffic" : "log");
  $("log-save").onclick = saveCsv;
  $("log-clear").onclick = () => { if (confirm("Clear the whole log? Save it first if you want to keep it.")) { log = []; saveLog(); updateLogBadge(); renderLog(); } };

  // ---------- boot ----------
  updateLogBadge();
  cfg.tab = cfg.tab === "log" ? "log" : "traffic";
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === cfg.tab));
  $("tab-traffic").classList.toggle("on", cfg.tab === "traffic");
  $("tab-log").classList.toggle("on", cfg.tab === "log");
  if (cfg.tab === "log") renderLog();
  $("range").textContent = range();
  $("panel").classList.toggle("hidden", !cfg.panel);
  document.body.classList.toggle("nopanel", !cfg.panel);
  $("btn-panel").classList.toggle("on", cfg.panel);
  $("btn-labels").classList.toggle("on", cfg.labels);
  $("btn-map").classList.toggle("on", cfg.map);
  window.addEventListener("resize", resize);
  document.fonts?.ready.then(drawBackground);
  resize();
  loadMap();
  applyLocation();
  if (!cfg.geoAsked) {
    cfg.geoAsked = true; save();
    locate((lat, lon) => { cfg.lat = +lat.toFixed(4); cfg.lon = +lon.toFixed(4); cfg.name = "MY POSITION"; save(); applyLocation(); });
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
